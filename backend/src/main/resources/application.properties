# =====================================================
# DATABASE CONFIGURATION - PostgreSQL
# Toutes les valeurs sont surchargeables par variables d'environnement
# (obligatoire en production / Render — ne jamais committer de vrais secrets ici).
# =====================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mission_flow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA/HIBERNATE CONFIGURATION
# =====================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =====================================================
# SERVER
# Render fournit le port à écouter via la variable d'environnement PORT.
# =====================================================
server.port=${PORT:8080}
server.servlet.context-path=/
spring.application.name=cabinet-acte

# =====================================================
# LOGGING
# Ne jamais activer le TRACE du binder SQL en production : il journalise
# les valeurs des paramètres de requêtes (donc potentiellement des données
# sensibles : mots de passe, emails, etc.) en clair dans les logs.
# =====================================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.cabinet.acte=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_SQL_PARAMS:WARN}

# =====================================================
# ACTUATOR
# Endpoints protégés par Spring Security (authentification requise) ;
# "when-authorized" évite d'exposer les détails de santé (DB, disque...)
# à un simple utilisateur authentifié sans rôle particulier.
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# =====================================================
# JWT CONFIGURATION
# ATTENTION : jwt.secret DOIT être défini via la variable d'environnement
# JWT_SECRET en production, avec une valeur longue et aléatoire
# (ex: openssl rand -base64 48). La valeur par défaut ci-dessous ne sert
# qu'au développement local et ne doit jamais être utilisée en production.
# =====================================================
jwt.secret=${JWT_SECRET:ceciEstUneCleSecreteDeDevUniquement-NePasUtiliserEnProd-32c+}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================================
# CORS
# Domaine(s) autorisés à appeler l'API, séparés par des virgules.
# En production (Render), définir CORS_ALLOWED_ORIGINS avec l'URL exacte
# du frontend déployé (ex: https://missionflow.onrender.com).
# =====================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# =====================================================
# COMPTE ADMINISTRATEUR PAR DÉFAUT (créé au premier démarrage si absent)
# À changer en production via ADMIN_EMAIL / ADMIN_PASSWORD, puis à modifier
# depuis l'application une fois connecté.
# =====================================================
app.admin.email=${ADMIN_EMAIL:admin@cabinet-acte.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
