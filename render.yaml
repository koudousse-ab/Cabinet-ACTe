databases:
  - name: cabinet-acte-db
    databaseName: cabinet_acte
    plan: free

services:
  # ─── Backend Spring Boot (via Docker, Render n'a pas de runtime Java natif) ───
  - type: web
    name: cabinet-acte-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: cabinet-acte-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: cabinet-acte-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: cabinet-acte-db
          property: password
      - key: DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: ADMIN_EMAIL
        value: admin@cabinet-acte.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://cabinet-acte-frontend.onrender.com
      - key: LOG_LEVEL_SQL
        value: WARN
      - key: LOG_LEVEL_SQL_PARAMS
        value: WARN

  # ─── Frontend React (Vite) — site statique ───
  - type: web
    name: cabinet-acte-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cabinet-acte-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
