databases:
  - name: missionflow-db
    databaseName: mission_flow
    plan: free

services:
  # ─── Backend Spring Boot ───
  - type: web
    name: missionflow-backend
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/*.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: missionflow-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: missionflow-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: missionflow-db
          property: password
      - key: DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: ADMIN_EMAIL
        value: admin@cabinet-acte.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://missionflow-frontend.onrender.com
      - key: LOG_LEVEL_SQL
        value: WARN
      - key: LOG_LEVEL_SQL_PARAMS
        value: WARN

  # ─── Frontend React (Vite) — site statique ───
  - type: web
    name: missionflow-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://missionflow-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
